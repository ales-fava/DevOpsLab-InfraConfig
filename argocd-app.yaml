apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: angular-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/ales-fava/DevOpsLab-InfraConfig' # <--- URL DE TU REPO DE INFRA
    targetRevision: HEAD
    path: helm/mywebapp
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true