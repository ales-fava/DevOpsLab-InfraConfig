---
- name: Configurar Infraestructura DevOps (Docker + K8s)
  hosts: minikube_host
  become: true
  vars:
    kubectl_version: "v1.30.0"
    minikube_version: "latest"
    arch: "amd64"
    argocd_nodeport: 30443

  tasks:
    - name: Actualizar paquetes del sistema
      apt:
        update_cache: yes
        upgrade: dist

    - name: Instalar dependencias básicas
      apt:
        name:
          - curl
          - git
          - apt-transport-https
          - conntrack
          - socat
          - ca-certificates
          - gnupg
        state: present

    # --- INSTALACIÓN DE DOCKER ---
    - name: Descargar script de instalación de Docker
      get_url:
        url: https://get.docker.com
        dest: /tmp/install_docker.sh
        mode: '0700'

    - name: Ejecutar script de instalación de Docker
      shell: /tmp/install_docker.sh

    - name: Añadir usuario azureuser al grupo docker
      user:
        name: azureuser
        groups: docker
        append: yes

    # --- [CRITICO] REINICIO DE CONEXIÓN ---
    # Esto obliga a Ansible a cerrar SSH y volver a abrirlo.
    # Así, la nueva sesión ya sabe que el usuario pertenece al grupo 'docker'.
    - name: Reiniciar sesión SSH para aplicar permisos de grupo Docker
      meta: reset_connection

    # --- HERRAMIENTAS K8S ---
    - name: Descargar Kubectl
      get_url:
        url: "https://dl.k8s.io/release/{{ kubectl_version }}/bin/linux/{{ arch }}/kubectl"
        dest: /usr/local/bin/kubectl
        mode: '0755'

    - name: Descargar Minikube
      get_url:
        url: "https://storage.googleapis.com/minikube/releases/{{ minikube_version }}/minikube-linux-{{ arch }}"
        dest: /usr/local/bin/minikube
        mode: '0755'

    # --- INICIO DE MINIKUBE ---
    - name: Iniciar Minikube con Docker Driver
      become: yes
      become_user: azureuser
      shell: |
        # Añadimos --ports para mapear el puerto del contenedor al host (VM Azure)
        minikube start --driver=docker --addons=ingress --addons=metrics-server --ports=30443:30443
      register: minikube_start
      changed_when: "'Done' in minikube_start.stdout"
      environment:
        HOME: /home/azureuser

    - name: Configurar alias de kubectl
      become: yes
      become_user: azureuser
      lineinfile:
        path: /home/azureuser/.bashrc
        line: 'alias k=kubectl'

    # --- ARGOCD ---
    - name: Crear namespace para ArgoCD
      become: yes
      become_user: azureuser
      shell: kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -

    - name: Desplegar ArgoCD
      become: yes
      become_user: azureuser
      shell: |
        kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml

    - name: Esperar a que ArgoCD Server esté listo (Timeout 5m)
      become: yes
      become_user: azureuser
      # El timeout es vital para dar tiempo a que los pods arranquen
      shell: |
        kubectl wait --for=condition=available deployment/argocd-server -n argocd --timeout=300s

    - name: Exponer ArgoCD vía NodePort (Puerto {{ argocd_nodeport }})
      become: yes
      become_user: azureuser
      shell: |
        kubectl patch svc argocd-server -n argocd -p '{"spec": {"type": "NodePort", "ports": [{"port": 443, "targetPort": 8080, "nodePort": {{ argocd_nodeport }}}]}}'

    - name: Obtener contraseña inicial de admin de ArgoCD
      become: yes
      become_user: azureuser
      shell: |
        kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 -d
      register: argocd_pass

    - name: Mostrar datos de acceso a ArgoCD
      debug:
        msg: 
          - "ArgoCD instalado correctamente."
          - "URL de acceso: https://{{ ansible_host }}:{{ argocd_nodeport }}"
          - "Usuario: admin"
          - "Contraseña: {{ argocd_pass.stdout }}"